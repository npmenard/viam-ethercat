name: Publish Docker

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'Dockerfile'

jobs:
  docker:
    name: Build Docker Image
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out code
        uses: actions/checkout@v4

      - name: Build and Push
        run: make docker-amd64-ci
