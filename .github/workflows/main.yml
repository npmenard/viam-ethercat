name: EtherCAT CI Pipeline

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: ['main']
  push:
    branches:
      - '**'
  release:
    types: [published]

# Lean CI, linux/amd64 only for now: every push runs format + lint + build +
# test inside the project build image. The Conan module build (and the
# registry publish) only runs for tags, releases, and manual dispatch.
jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/viam-ethercat:amd64
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format
        run: make format-check

  build-test-lint:
    name: Build, Test, and Lint (amd64)
    runs-on: ubuntu-latest
    # The container image is built from this repo's Dockerfile (see docker.yml) and
    # published to the repo owner's ghcr, so forks are self-sufficient: dispatch
    # docker.yml once to build the image, then this job uses it. It ships the
    # clang-19 toolchain, cmake, boost, and a prebuilt viam-cpp-sdk so the module's
    # find_package(viam-cpp-sdk) resolves without a from-source SDK build.
    container:
      image: ghcr.io/${{ github.repository_owner }}/viam-ethercat:amd64
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: make configure

      - name: Clang-check
        run: make run-clang-check

      - name: Clang-tidy
        run: make run-clang-tidy-parallel

      - name: Build
        run: make build

      - name: Test
        run: make test

  thread-sanitizer:
    name: ThreadSanitizer (RT boundary, amd64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/viam-ethercat:amd64
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # NOTE: this used to also run on a NATIVE arm64 runner, which is the only
    # authoritative check of the seqlock fence placement (x86 is TSO and hides
    # weak-ordering mistakes; qemu serializes to ~TSO too). We only target
    # linux/amd64 for now, so that leg was dropped -- this is a KNOWN
    # weak-ordering-coverage gap. If arm64 ever becomes a target again,
    # restore a native (never emulated) arm64 leg here.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build the RT-boundary tests under ThreadSanitizer. The seqlock +
      # lock-free TxPDO handoff must be race-free with ZERO suppressions.
      # The TSan lane is CLANG-ONLY (gcc rejects atomic_thread_fence under
      # -fsanitize=thread; the seqlock fences are load-bearing) -- pin clang-19
      # explicitly, else CMake configures with the container's default gcc and
      # silently skips the tsan targets.
      - name: Configure (TSan)
        run: cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 -DETHERCAT_BUILD_MODULE=OFF -DETHERCAT_SANITIZE_THREAD=ON

      - name: Build (TSan)
        run: cmake --build build-tsan --target pdo_cache_test_tsan -- -j4

      - name: Run TSan tests
        run: ctest --test-dir build-tsan -L tsan --output-on-failure

  build-module:
    name: Build Module (Conan, linux/amd64)
    needs: [build-test-lint]
    # The release artifact is only needed for tags, releases, and manual
    # dispatch, so the Conan build is skipped on ordinary pushes.
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release'
    runs-on: ubuntu-latest
    # The C++ SDK's conan image ships conan, gcc 13, and a default conan
    # profile. Pinned to a dated tag so the release toolchain only changes
    # deliberately; keep etc/conan/linux.profile and the README in sync when
    # bumping it.
    container: ghcr.io/viamrobotics/cpp-sdk-conan-ubuntu:noble-2026-11.00
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup C++ SDK
        run: ./bin/setup.sh

      - name: Build module
        run: ./bin/build.sh

      # Attach module.tar.gz to workflow run
      - name: Attach build artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-linux-amd64
          path: module.tar.gz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to Viam Module Registry
    needs: [build-module]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: module-linux-amd64

      - name: Extract meta.json from module archive
        run: tar -xzf module.tar.gz meta.json

      - name: Upload module to Viam
        uses: viamrobotics/upload-module@v1
        with:
          module-path: module.tar.gz
          platform: linux/amd64
          version: ${{ github.ref_name }}
          key-id: ${{ secrets.VIAM_DEV_API_KEY_ID }}
          key-value: ${{ secrets.VIAM_DEV_API_KEY }}
          do-update: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
          do-upload: ${{ github.event_name == 'release' }}
