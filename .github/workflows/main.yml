name: EtherCAT CI Pipeline

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: ['main']
  push:
    branches:
      - '**'
  release:
    types: [published]

jobs:
  build-test-lint:
    name: Build, Test, and Lint (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # The container image is built from this repo's Dockerfile and published to
    # ghcr.io/viam-modules/ethercat:{amd64,arm64}. It ships the clang-19
    # toolchain, cmake, boost, and a prebuilt viam-cpp-sdk so the module's
    # find_package(viam-cpp-sdk) resolves without a from-source SDK build.
    container: ghcr.io/viam-modules/ethercat:${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-4cpu-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: make configure

      - name: Format
        run: make format-check

      - name: Clang-check
        run: make run-clang-check

      - name: Clang-tidy
        run: make run-clang-tidy-parallel

      - name: Build
        run: make build

      - name: Test
        run: make test

  thread-sanitizer:
    name: ThreadSanitizer (RT boundary, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ghcr.io/viam-modules/ethercat:${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-4cpu-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build the RT-boundary tests under ThreadSanitizer. The seqlock +
      # lock-free TxPDO handoff must be race-free with ZERO suppressions.
      - name: Configure (TSan)
        run: cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DETHERCAT_BUILD_MODULE=OFF -DETHERCAT_SANITIZE_THREAD=ON

      - name: Build (TSan)
        run: cmake --build build-tsan --target pdo_cache_test_tsan -- -j4

      - name: Run TSan tests
        run: ctest --test-dir build-tsan -L tsan --output-on-failure
